# =============================================================================
# cami-fetch — data retrieval from ENA
# -----------------------------------------------------------------------------
# Processes: FETCH_GENOME, FETCH_UNMAPPED_BAM
#
# Every version here is the one that produced the published results. Pin it,
# never relax it: bin/fetch_unmapped.sh reads BAM index byte ranges over HTTP,
# and a samtools that changes how it reports the index would change which bytes
# are fetched.
# =============================================================================
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.13      # bin/bai_offsets.py
  - aria2=1.37.0
  - curl=8.21.0
  - samtools=1.24
  - htslib=1.24         # bgzip
  - pigz=2.8
  - gawk=5.3.1
  - procps-ng=4.0.4     # Nextflow reads /proc for the task trace
