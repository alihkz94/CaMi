# =============================================================================
# cami-qc — trimming, deduplication and the QC gate
# -----------------------------------------------------------------------------
# Processes: SUBSAMPLE_TRIM, DEDUP, AGGREGATE_QC
#
# python + seqkit are here because bin/qc_checkpoints.py shells out to
# `seqkit stats` to count the surviving reads at each checkpoint.
# =============================================================================
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.13
  - fastp=1.3.6
  - seqkit=2.13.0
  - pigz=2.8
  - gawk=5.3.1
  - procps-ng=4.0.4
