# =============================================================================
# cami-confirm — confirmation of detections by BLAST
# -----------------------------------------------------------------------------
# Processes: CONFIRM_DRAW, CONFIRM_BLAST_PREP, CONFIRM_BLAST, CONFIRM_COMBINE
# (CONFIRM_KRAKEN runs in cami-classify, beside Kraken 2.)
#
# The nt DATABASE is not in this image: it is ~700 GB. It is bind-mounted at run
# time from --blast_db. The Python scripts use the standard library only.
# =============================================================================
name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  - blast=2.17.0
  - python=3.12
  - gawk=5.3.1
  - coreutils=9.11
  - procps-ng=4.0.4
